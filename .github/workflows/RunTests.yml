name: RunTests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Upgrade pip & wheel
        run: |
          python -m pip install --upgrade pip wheel

      - name: Install package with test dependencies
        run: |
          pip install -e ".[test]"

      - name: Run Config Tests
        run: |
          pytest -vv tests/test_config.py

      - name: Run Constraints Tests
        run: |
          pytest -vv tests/test_constraints.py

      - name: Run Exceptions Tests
        run: |
          pytest -vv tests/test_exceptions.py
      
      - name: Run Logging Utils Tests
        run: |
          pytest -vv tests/test_logging_utils.py

      - name: Run Utils Tests
        run: |
          pytest -vv tests/test_utils.py

      - name: Run PAVA Tests
        run: |
          pytest -vv tests/test_pava.py
        
      - name: Run Merge Tests
        run: |
          pytest -vv tests/test_merge.py

      - name: Run MOB Tests
        run: |
          pytest -vv tests/test_mob.py

      - name: Run Categorical Merge Tests
        run: |
          pytest -vv tests/test_categorical_merge.py

      - name: Run Plotting Tests
        run: |
          pytest -vv tests/test_plotting.py