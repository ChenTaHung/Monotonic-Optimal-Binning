name: mobpy
channels:
  - conda-forge
dependencies:
  # Core language/runtime
  - python>=3.13
  - pip>=24

  # Runtime (matches pyproject.toml)
  - numpy>=2.0.0
  - pandas>=1.3.0
  - scipy>=1.7.0

  # Optional but handy to have in the environment so examples/plots & tests run out of the box
  - matplotlib>=3.7

  # Dev / testing
  - pytest>=8
  - hypothesis>=6

  # Install this project in editable mode
  - pip:
      - -e .
